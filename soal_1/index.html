<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubus Corner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Pojok kiri atas -->
    <div class="corner top-left">
        <div class="cube">
            <div class="circle"></div>
        </div>
    </div>

    <!-- Kotak tengah atas -->
    <div class="corner top-center">
        <div class="cube"></div>
    </div>

    <!-- Pojok kanan atas -->
    <div class="corner top-right">
        <div class="cube"></div>
    </div>

    <!-- Pojok kiri bawah -->
    <div class="corner bottom-left">
        <div class="cube"></div>
    </div>

    <!-- Pojok kanan bawah -->
    <div class="corner bottom-right">
        <div class="cube"></div>
    </div>

    <!-- Persegi panjang melintang sisi kiri -->
    <div class="side-rect"></div>

    <!-- 5 KOTAK TEPAT DI TENGAH LAYAR (3 Atas, 2 Bawah) -->
    <div class="center-grid">
        <div class="mid-cube"></div>
        <div class="mid-cube"></div>
        <div class="mid-cube"></div>
        <div class="mid-cube"></div>
        <div class="mid-cube"></div>
    </div>
</body>
</html>a
