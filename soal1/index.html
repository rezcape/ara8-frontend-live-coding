<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARA 8.0 - Live Coding Layout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Garis tebal di sisi kiri dari ujung atas ke bawah -->
  <div class="left-vertical-line"></div>

  <!-- 4 Kotak di Ujung Layar -->
  <!-- Hanya kotak kiri atas yang memiliki bulatan ungu di tengahnya -->
  <div class="corner-box top-left">
    <div class="purple-circle circle-inside-center"></div>
  </div>

  <div class="corner-box top-right"></div>
  <div class="corner-box bottom-left"></div>
  <div class="corner-box bottom-right"></div>

  <!-- Kotak di Tengah Atas & Tengah Bawah -->
  <div class="edge-box top-center"></div>
  <div class="edge-box bottom-center"></div>

  <!-- Container 5 Kotak Tengah -->
  <main class="center-container">
    <div class="center-box"></div>
    <div class="center-box"></div>
    <div class="center-box"></div>
    <div class="center-box"></div>
    <div class="center-box"></div>
  </main>

</body>
</html>
